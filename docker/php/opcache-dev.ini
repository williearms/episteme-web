; Local dev fix for Windows + Docker Desktop bind-mount performance.
;
; The Sail 8.5 runtime disables opcache for the CLI SAPI by default, and
; php artisan serve (used by this runtime instead of PHP-FPM/Nginx) runs as
; CLI. Combined with a bind-mounted project directory on Windows, every
; request recompiles the entire framework + Filament + Livewire from source,
; taking ~20s per request instead of under 1s.
opcache.enable_cli = 1
; Skip per-request mtime checks on every included file (also slow on this
; bind mount). Code changes require restarting the laravel.test container
; (or `docker compose exec laravel.test kill -USR2 1`-style opcache reset)
; to be picked up while this is off.
opcache.validate_timestamps = 0
